<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garena Free Fire Team</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#292929;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.header{
  height:126px;background:linear-gradient(180deg,#6ec6e9,#5bb8db);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px #111;font-size:38px;font-weight:800;
  text-shadow:0 3px 4px rgba(0,0,0,.35)
}
.wrap{max-width:900px;margin:auto;padding:95px 38px 130px}
.title{text-align:center;font-size:42px;font-weight:800;margin:0 0 48px}
.video{
  position:relative;width:100%;aspect-ratio:16/8.3;border-radius:28px;
  overflow:hidden;background:
    radial-gradient(circle at 50% 45%,rgba(0,190,255,.55),transparent 30%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 2px,transparent 2px 72px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 55px),
    linear-gradient(135deg,#06283b,#0798d0 48%,#06334a);
  box-shadow:0 10px 25px rgba(0,0,0,.35)
}
.phone{
  position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
  width:25%;height:82%;border:5px solid #111;border-radius:27px;
  background:linear-gradient(#eee,#ddd);box-shadow:0 0 12px #000;
}
.phone:before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
 width:30%;height:7px;background:#222;border-radius:10px}
.screen{margin:16px 8px 8px;height:92%;border-radius:15px;background:#fafafa;color:#777;
 padding:18px 8px;font-size:10px}
.screen .bar{height:10px;background:#ddd;margin:12px 0;border-radius:5px}
.play{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:0;height:0;border-top:25px solid transparent;border-bottom:25px solid transparent;
 border-left:38px solid #fff;filter:drop-shadow(0 2px 2px #555);z-index:3
}
.controls{position:absolute;left:30px;right:30px;bottom:25px;height:55px}
.time{font-size:20px;position:absolute;bottom:24px;left:0}
.full{position:absolute;right:5px;bottom:18px;font-size:25px}
.dots{position:absolute;right:-5px;bottom:12px;font-size:29px}
.track{position:absolute;left:0;right:0;bottom:0;height:7px;background:#777;border-radius:8px}
.progress{width:28%;height:100%;background:#eee;border-radius:8px}
.knob{position:absolute;left:7%;top:50%;transform:translateY(-50%);width:23px;height:23px;border-radius:50%;background:#fff}

.card{
 margin-top:95px;padding:42px;border-radius:38px;
 background:#0f0f0f;position:relative;overflow:hidden;
 box-shadow:0 12px 30px rgba(0,0,0,.45)
}
.card:before{
 content:"";position:absolute;inset:0;padding:5px;border-radius:38px;
 background:linear-gradient(135deg,#ff1700,#ff8a00,#d8ef00,#00d85a,#00a9ff,#7a00ff);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none
}
.badges{display:flex;gap:16px;margin-left:31%;margin-bottom:12px}
.badge{padding:11px 24px;border-radius:24px;font-size:19px;font-weight:800}
.new{background:#ff4348}.premium{background:#6a5ae8}
.content{display:flex;align-items:center;gap:30px}
.icon{width:130px;height:130px;border-radius:25px;object-fit:cover;
 background:radial-gradient(circle,#5ee9ff,#0068a6 45%,#10233c);
 display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;
 text-align:center;box-shadow:inset 0 0 25px rgba(0,0,0,.4)}
.info{flex:1}.name{font-size:39px;font-weight:500;margin-bottom:14px}
.desc{font-size:25px;line-height:1.35;color:#aaa}
.stars{color:#ffd21c;font-size:31px;letter-spacing:2px;margin-top:18px}
.install{
 margin-top:45px;width:100%;border:0;border-radius:60px;padding:22px;
 font-size:31px;font-weight:700;color:#fff;background:linear-gradient(90deg,#00ef82,#00cf69);
 cursor:pointer;box-shadow:0 8px 24px rgba(0,255,130,.22)
}
.install:active{transform:scale(.99)}
.note{text-align:center;color:#888;font-size:13px;margin-top:18px}

@media(max-width:600px){
 .header{height:126px;font-size:34px}
 .wrap{padding:96px 38px 100px}
 .title{font-size:40px;margin-bottom:48px}
 .video{border-radius:28px}
 .phone{width:28%;height:82%}
 .controls{left:30px;right:30px}
 .card{margin-top:94px;padding:42px 38px}
 .badges{margin-left:0;justify-content:center;gap:12px}
 .badge{font-size:17px;padding:10px 20px}
 .content{gap:26px}
 .icon{width:125px;height:125px;min-width:125px}
 .name{font-size:35px}
 .desc{font-size:23px}
 .install{font-size:30px;padding:21px}
}
@media(max-width:430px){
 .header{font-size:32px}
 .wrap{padding-left:38px;padding-right:38px}
 .title{font-size:39px;white-space:nowrap}
 .video{aspect-ratio:1.42}
 .card{padding:38px 40px}
 .content{gap:23px}
 .icon{width:118px;min-width:118px;height:118px}
 .name{font-size:34px}
 .desc{font-size:22px}
}
</style>
</head>
<body>

<header class="header">Garena Free Fire Team</header>

<main class="wrap">
  <h1 class="title">WATCH FULL VIDEO</h1>

  <section class="video" aria-label="Video preview">
    <div class="phone">
      <div class="screen">
        <b>Shared by Friend</b>
        <div class="bar"></div><div class="bar"></div>
        <div class="bar" style="width:70%"></div>
        <div style="margin-top:35px;text-align:center">Video Preview</div>
      </div>
    </div>
    <div class="play"></div>
    <div class="controls">
      <span class="time">0:03 / 1:04</span>
      <span class="full">⛶</span>
      <span class="dots">⋮</span>
      <div class="track"><div class="progress"></div><div class="knob"></div></div>
    </div>
  </section>

  <section class="card">
    <div class="badges">
      <span class="badge new">NEW</span>
      <span class="badge premium">PREMIUM</span>
    </div>
    <div class="content">
      <div class="icon">FREE<br>FIRE<br>💎</div>
      <div class="info">
        <div class="name">FREE DIAMONDS</div>
        <div class="desc">FREE FIRE UNLIMITED<br>DIAMONDS · INSTANT CLAIM</div>
        <div class="stars">★★★★★</div>
      </div>
    </div>
    <button class="install" type="button" onclick="alert('Demo button — no download or data collection.')">Install</button>
    <div class="note">Demo UI • This button does not install anything.</div>
  </section>
</main>
</body>
</html>
